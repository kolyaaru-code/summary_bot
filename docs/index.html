<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Найди писюн</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #ff4d6d;
    --accent2: #ff8fa3;
    --gold: #ffd60a;
    --text: #f0f0f5;
    --muted: #6b6b80;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Onest', sans-serif;
  }

  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: clamp(10px, 3vw, 20px);
    gap: clamp(8px, 2vw, 12px);
    max-width: 480px;
    margin: 0 auto;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(14px, 4vw, 20px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .player-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 6px 14px;
    font-size: clamp(11px, 3vw, 13px);
    font-weight: 600;
    color: var(--accent2);
    white-space: nowrap;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 4px;
  }
  .tab {
    flex: 1;
    padding: clamp(8px, 2vw, 11px);
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(10px, 2.6vw, 12px);
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.2px;
  }
  .tab.active {
    background: var(--surface2);
    color: var(--text);
    box-shadow: 0 1px 8px rgba(0,0,0,0.4);
  }

  /* PANELS */
  .panel { display: none; flex: 1; flex-direction: column; min-height: 0; gap: clamp(8px, 2vw, 12px); overflow: hidden; }
  .panel.active { display: flex; }

  /* RESULT BANNER */
  .result-banner {
    flex-shrink: 0;
    border-radius: var(--radius);
    text-align: center;
    font-size: clamp(12px, 3.2vw, 14px);
    font-weight: 600;
    line-height: 1.4;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
    padding: 0 clamp(14px, 3vw, 18px);
  }
  .result-banner.show {
    max-height: 100px;
    opacity: 1;
    padding: clamp(10px, 2.5vw, 13px) clamp(14px, 3vw, 18px);
  }
  .result-banner.win {
    background: linear-gradient(135deg, rgba(46,204,113,0.15), rgba(46,204,113,0.05));
    border: 1px solid rgba(46,204,113,0.4);
    color: #2ecc71;
  }
  .result-banner.lose {
    background: linear-gradient(135deg, rgba(255,77,109,0.15), rgba(255,77,109,0.05));
    border: 1px solid rgba(255,77,109,0.4);
    color: var(--accent);
  }

  /* GRID */
  .grid-outer {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vw, 12px);
  }
  .grid-wrap {
    width: min(100%, 55dvh);
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(7px, 2vw, 11px);
  }

  .box {
    aspect-ratio: 1;
    border-radius: clamp(10px, 3vw, 16px);
    background: var(--surface);
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(26px, 7.5vw, 40px);
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    position: relative;
    overflow: hidden;
    user-select: none;
  }
  .box::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.04), transparent);
    border-radius: inherit;
  }
  .box:hover:not(.done) { transform: scale(1.05); border-color: var(--accent); background: var(--surface2); }
  .box:active:not(.done) { transform: scale(0.93); }
  .box.done { cursor: default; }
  .box.winner {
    background: linear-gradient(135deg, rgba(255,214,10,0.2), rgba(255,214,10,0.05));
    border-color: var(--gold);
    animation: pulse-win 0.5s ease;
  }
  .box.loser {
    background: linear-gradient(135deg, rgba(255,77,109,0.15), rgba(255,77,109,0.05));
    border-color: var(--accent);
    animation: shake 0.4s ease;
  }
  .box.neutral.done { opacity: 0.28; }

  @keyframes pulse-win {
    0% { transform: scale(1); }
    40% { transform: scale(1.12); }
    70% { transform: scale(0.96); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    60% { transform: translateX(6px); }
  }

  /* PLAY AGAIN */
  .play-again {
    width: min(100%, 55dvh);
    padding: clamp(11px, 2.5vw, 15px);
    border-radius: var(--radius);
    background: linear-gradient(135deg, var(--accent), #c9184a);
    border: none;
    color: #fff;
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(12px, 3vw, 14px);
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.15s;
    opacity: 0;
    pointer-events: none;
    transform: translateY(4px);
  }
  .play-again.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
    transition: all 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .play-again:hover { opacity: 0.88; }
  .play-again:active { transform: scale(0.97); }

  /* TOKEN EXPIRED NOTICE */
  .expired-notice {
    width: min(100%, 55dvh);
    background: linear-gradient(135deg, rgba(255,214,10,0.1), rgba(255,214,10,0.03));
    border: 1px solid rgba(255,214,10,0.3);
    border-radius: var(--radius);
    padding: clamp(10px, 2.5vw, 13px) clamp(14px, 3vw, 18px);
    text-align: center;
    font-size: clamp(12px, 3vw, 14px);
    color: var(--gold);
    font-weight: 600;
    display: none;
    line-height: 1.5;
  }
  .expired-notice.show { display: block; }

  /* LEADERBOARD PANEL */
  .leaderboard {
    flex: 1;
    min-height: 0;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .lb-header {
    padding: clamp(10px, 2.5vw, 14px) clamp(14px, 3vw, 18px);
    border-bottom: 1px solid var(--border);
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(11px, 2.8vw, 13px);
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .lb-list {
    flex: 1;
    overflow-y: auto;
    padding: clamp(6px, 1.5vw, 10px);
    scrollbar-width: none;
  }
  .lb-list::-webkit-scrollbar { display: none; }
  .lb-row {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: clamp(7px, 1.8vw, 10px) clamp(8px, 2vw, 12px);
    border-radius: 10px;
    transition: background 0.15s;
  }
  .lb-row:hover { background: var(--surface2); }
  .lb-row.me {
    background: linear-gradient(135deg, rgba(255,77,109,0.1), rgba(255,77,109,0.03));
    border: 1px solid rgba(255,77,109,0.2);
  }
  .lb-rank {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(11px, 2.8vw, 13px);
    font-weight: 700;
    text-align: center;
  }
  .lb-name {
    font-size: clamp(12px, 3vw, 14px);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lb-name.me-label { color: var(--accent2); }
  .lb-stats {
    font-size: clamp(11px, 2.8vw, 13px);
    color: var(--muted);
    font-weight: 500;
    text-align: right;
    white-space: nowrap;
  }
  .lb-pct { font-size: clamp(10px, 2.5vw, 11px); color: var(--muted); margin-left: 4px; }
  .lb-empty { text-align: center; color: var(--muted); padding: 24px; font-size: 13px; }

  /* SCREENS */
  .loading-screen, .expired-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100dvh; text-align: center; padding: 30px; gap: 16px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--muted); font-size: 14px; }
  .expired-emoji { font-size: 60px; }
  .expired-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 20px; font-weight: 900; color: var(--accent);
  }
  .expired-sub { color: var(--muted); font-size: 14px; line-height: 1.6; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <div class="loading-text">Загружаем игру...</div>
</div>

<div class="expired-screen hidden" id="expiredScreen">
  <div class="expired-emoji">⏱️</div>
  <div class="expired-title">Ссылка устарела</div>
  <div class="expired-sub">Напиши /game в чате<br>и получи свежую ссылку</div>
</div>

<div class="app hidden" id="mainApp">

  <div class="header">
    <div class="logo">🍆 Найди писюн</div>
    <div class="player-badge" id="playerBadge">—</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabGame" onclick="switchTab('game')">🎮 Игра</button>
    <button class="tab" id="tabLb" onclick="switchTab('lb')">🏆 Таблица лидеров</button>
  </div>

  <!-- GAME PANEL -->
  <div class="panel active" id="panelGame">
    <div class="result-banner" id="resultBanner"></div>
    <div class="grid-outer">
      <div class="grid-wrap" id="grid"></div>
      <button class="play-again" id="playAgainBtn" onclick="playAgain()">🔄 Сыграть ещё раз</button>
      <div class="expired-notice" id="expiredNotice">⏱️ Ссылка истекла — напиши /game в чате для новой</div>
    </div>
  </div>

  <!-- LEADERBOARD PANEL -->
  <div class="panel" id="panelLb">
    <div class="leaderboard">
      <div class="lb-header">🏆 Таблица лидеров</div>
      <div class="lb-list" id="lbList">
        <div class="lb-empty">Загружаем рейтинг...</div>
      </div>
    </div>
  </div>

</div>

<script>
  const RAILWAY_URL = "https://summarybot-production-0954.up.railway.app";
  const MEDALS = ["🥇","🥈","🥉"];

  let playerName = null;
  let playerToken = null;
  let tokenTs = 0;
  let gameOver = false;
  let winnerPos = null;
  const TOKEN_TTL = 300;

  // ─── INIT ───
  window.addEventListener('load', async () => {
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) { showExpiredScreen(); return; }

    try {
      const b64 = token.split(".")[0];
      // Правильное декодирование UTF-8 из base64
      const bytes = Uint8Array.from(
        atob(b64.replace(/-/g, '+').replace(/_/g, '/')),
        c => c.charCodeAt(0)
      );
      const payload = JSON.parse(new TextDecoder('utf-8').decode(bytes));
      const age = Math.floor(Date.now() / 1000) - payload.ts;
      if (age > TOKEN_TTL) { showExpiredScreen(); return; }
      playerName = payload.user_name;
      playerToken = token;
      tokenTs = payload.ts;
    } catch(e) {
      showExpiredScreen(); return;
    }

    document.getElementById("loadingScreen").classList.add("hidden");
    document.getElementById("mainApp").classList.remove("hidden");
    document.getElementById("playerBadge").textContent = playerName;

    buildGrid();
    loadScores();
  });

  // ─── TABS ───
  function switchTab(tab) {
    document.getElementById("tabGame").classList.toggle("active", tab === 'game');
    document.getElementById("tabLb").classList.toggle("active", tab === 'lb');
    document.getElementById("panelGame").classList.toggle("active", tab === 'game');
    document.getElementById("panelLb").classList.toggle("active", tab === 'lb');
  }

  // ─── BUILD GRID ───
  function buildGrid() {
    gameOver = false;
    winnerPos = Math.floor(Math.random() * 9);
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    for (let i = 0; i < 9; i++) {
      const box = document.createElement("div");
      box.className = "box";
      box.textContent = "📦";
      box.addEventListener("click", () => handleClick(i));
      grid.appendChild(box);
    }
  }

  // ─── HANDLE CLICK ───
  async function handleClick(chosen) {
    if (gameOver) return;
    gameOver = true;

    const won = chosen === winnerPos;
    const boxes = document.querySelectorAll(".box");
    boxes.forEach((box, i) => {
      box.classList.add("done");
      if (i === winnerPos) { box.textContent = "🍆"; box.classList.add("winner"); }
      else if (i === chosen && !won) { box.textContent = "💨"; box.classList.add("loser"); }
      else { box.classList.add("neutral"); }
    });

    showResult(won, chosen);

    // Проверяем не истёк ли токен
    const age = Math.floor(Date.now() / 1000) - tokenTs;
    if (age < TOKEN_TTL) {
      document.getElementById("playAgainBtn").classList.add("show");
    } else {
      document.getElementById("expiredNotice").classList.add("show");
    }

    try {
      await fetch(`${RAILWAY_URL}/result`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: playerToken, won })
      });
      await loadScores();
    } catch(e) {
      console.error("Ошибка отправки:", e);
    }
  }

  // ─── TAUNTS (оригинальные фразы) ───
  function showResult(won, chosen) {
    const n = playerName;
    const box = winnerPos + 1;

    const winTexts = [
      `🍆 ${n} нашёл! Ну и что, теперь что с ним делать будешь?`,
      `🎉 ${n} везунчик, нашёл писюн. Маме расскажи.`,
      `🍆 ${n} нашёл писюн. Видимо не первый раз ищет.`,
      `🎉 Ну надо же, ${n} справился. Запиши в резюме.`,
    ];
    const loseTexts = [
      `💨 ${n}, ну ты лох. Писюн был в коробке ${box}, а ты куда полез?`,
      `🗑 ${n} не нашёл. Руки из жопы, коробка ${box} же была очевидна.`,
      `💨 ${n} промазал мимо писюна. Это талант — коробка ${box} прямо смотрела на тебя.`,
      `🤡 ${n}, серьёзно? Писюн в коробке ${box} сидел и ждал, а ты мимо.`,
    ];

    const texts = won ? winTexts : loseTexts;
    const text = texts[Math.floor(Math.random() * texts.length)];
    const banner = document.getElementById("resultBanner");
    banner.className = `result-banner ${won ? 'win' : 'lose'} show`;
    banner.textContent = text;
  }

  // ─── PLAY AGAIN ───
  function playAgain() {
    const age = Math.floor(Date.now() / 1000) - tokenTs;
    if (age >= TOKEN_TTL) {
      document.getElementById("playAgainBtn").classList.remove("show");
      document.getElementById("expiredNotice").classList.add("show");
      return;
    }
    // Сбрасываем UI
    const banner = document.getElementById("resultBanner");
    banner.className = "result-banner";
    document.getElementById("playAgainBtn").classList.remove("show");
    buildGrid();
  }

  // ─── SCORES ───
  async function loadScores() {
    try {
      const res = await fetch(`${RAILWAY_URL}/scores`);
      const data = await res.json();
      renderScores(data.scores || []);
    } catch(e) {
      document.getElementById("lbList").innerHTML =
        '<div class="lb-empty">Не удалось загрузить рейтинг</div>';
    }
  }

  function renderScores(scores) {
    const list = document.getElementById("lbList");
    if (!scores.length) {
      list.innerHTML = '<div class="lb-empty">Ещё никто не играл 👀</div>';
      return;
    }
    list.innerHTML = scores.map((s, i) => {
      const total = s.wins + s.losses;
      const pct = total ? Math.round((s.wins / total) * 100) : 0;
      const isMe = s.name === playerName;
      let rank;
      if (i < 3) rank = MEDALS[i];
      else if (i === scores.length - 1 && scores.length > 3) rank = "💩";
      else rank = `<span style="color:var(--muted);font-size:12px">${i+1}</span>`;
      return `
        <div class="lb-row ${isMe ? 'me' : ''}">
          <div class="lb-rank">${rank}</div>
          <div class="lb-name ${isMe ? 'me-label' : ''}">${esc(s.name)}${isMe ? ' 👈' : ''}</div>
          <div class="lb-stats">${s.wins}🍆 ${s.losses}💨<span class="lb-pct">${pct}%</span></div>
        </div>`;
    }).join('');
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showExpiredScreen() {
    document.getElementById("loadingScreen").classList.add("hidden");
    document.getElementById("expiredScreen").classList.remove("hidden");
  }
</script>
</body>
</html>
